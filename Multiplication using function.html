<!DOCTYPE html>
<html>

<head>
    <title>Multiply Example</title>
</head>

<body>

    <h2>Multiplication Program</h2>
    <p>Click the button to multiply numbers.</p>

    <button onclick="multiply(4)">Click Me!</button>

    <p id="result"></p>

    <script>
        function multiply(a, b) {

            if (b === undefined) {
                alert("The value of b is undefined");
                b = 5;
            }

            var result = a * b;

            document.getElementById("result").innerHTML = result;
        }
    </script>

</body>

</html>
